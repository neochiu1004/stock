<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="theme-color" content="#ffffff"/>
    <title>極簡再平衡系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#0b1120',
                            green: '#84cc16',
                            red: '#ef4444',
                            orange: '#f97316'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .nav-item.active { color: #0b1120; font-weight: 700; }
        .nav-item.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- 頂部狀態列 -->
    <header class="bg-white px-5 pb-3 flex justify-between items-center z-10 sticky top-0 shadow-sm border-b border-gray-100" style="padding-top: max(env(safe-area-inset-top), 1rem);">
        <h1 class="text-lg font-black text-brand-navy tracking-tight" id="header-title">資產總覽</h1>
        <button onclick="syncPrices()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center active:scale-95 transition-transform">
            <span class="material-symbols-outlined text-[20px] text-slate-600" id="sync-icon">sync</span>
        </button>
    </header>

    <!-- 主內容區 -->
    <main class="flex-1 overflow-y-auto hide-scrollbar pb-24 relative" id="main-container">
        
        <!-- ==================== TAB 1: 資產 (Assets) ==================== -->
        <section id="view-assets" class="px-5 py-6 space-y-6 hidden">
            <div class="flex flex-col items-center">
                <span class="text-sm font-bold text-slate-500 mb-1">總資產價值 (TWD)</span>
                <div class="text-4xl font-black text-brand-navy tracking-tighter" id="asset-total-value">0</div>
            </div>

            <!-- 圖表區 -->
            <div class="relative w-48 h-48 mx-auto my-4">
                <canvas id="assetChart"></canvas>
            </div>

            <!-- 總攬快速圖例 -->
            <div class="flex justify-center flex-wrap gap-x-4 gap-y-2 text-[11px] font-bold pb-2 border-b border-gray-200 px-4" id="asset-chart-legend">
                <!-- 動態生成圖例 -->
            </div>

            <div class="flex justify-between items-end mt-4">
                <h2 class="font-bold text-lg text-brand-navy">持有明細</h2>
                <span class="text-xs text-slate-400 font-medium" id="last-update-time">最後更新 --:--</span>
            </div>

            <div class="space-y-3" id="asset-list-container">
                <!-- 動態生成資產卡片 -->
            </div>

            <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mt-2">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-brand-navy flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-[16px]">payments</span>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-slate-800">現金 (交割戶)</div>
                        <div class="text-xs text-slate-400">點擊修改</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-base font-black text-brand-navy" id="asset-cash-value">0</div>
                    <div class="text-xs text-slate-400 font-bold" id="asset-cash-pct">0%</div>
                </div>
                <div class="absolute inset-x-5 opacity-0 h-16 cursor-pointer" onclick="openCashModal()"></div>
            </div>

            <button onclick="openAssetModal()" class="w-full py-3 mt-4 border-2 border-dashed border-gray-300 rounded-2xl text-slate-500 font-bold flex justify-center items-center gap-2 active:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-[20px]">add</span> 新增股票資產
            </button>
        </section>

        <!-- ==================== TAB 2: 再平衡 (Rebalance) ==================== -->
        <section id="view-rebalance" class="px-5 py-6 space-y-5 hidden">
            
            <div id="rebalance-alert" class="bg-brand-orange text-white p-4 rounded-2xl shadow-sm hidden">
                <div class="flex items-start gap-2">
                    <span class="material-symbols-outlined text-[24px]">error</span>
                    <div>
                        <h3 class="font-bold text-base mb-1">建議進行再平衡</h3>
                        <p class="text-xs opacity-90 leading-relaxed">部分資產配置已超出容許偏差 <span id="rebalance-alert-threshold">5%</span> (以 ★ 標記)</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <h3 class="font-bold text-brand-navy text-base">投入新資金</h3>
                <div class="flex items-center gap-3">
                    <div class="flex-1 relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-slate-400">NT$</span>
                        <input type="number" id="input-new-funds" class="w-full bg-slate-50 pl-12 pr-4 py-3 rounded-xl font-bold text-brand-navy border border-gray-200 outline-none focus:border-brand-navy transition-colors" value="0" inputmode="numeric" onchange="triggerRecalculate()">
                    </div>
                </div>
                <p class="text-[11px] text-slate-400">※新資金將根據目標配置比例自動分配到各資產類別</p>
                <div class="flex justify-between items-center pt-3 border-t border-gray-100">
                    <span class="text-sm font-medium text-slate-500">資產總額 + 新資金</span>
                    <span class="text-lg font-black text-brand-navy" id="rebalance-sim-total">NT$ 0</span>
                </div>
            </div>

            <h3 class="font-bold text-lg text-brand-navy pt-2">當前配置 ➔ 目標配置</h3>
            <div class="space-y-3" id="rebalance-actions-container">
                <!-- 動態生成買賣建議 -->
            </div>
            
            <div id="rebalance-safety-container">
                <!-- 交割安全評估 -->
            </div>
        </section>

        <!-- ==================== TAB 3: 目標配置 (Targets) ==================== -->
        <section id="view-targets" class="px-5 py-6 space-y-6 hidden">
            
            <div class="flex justify-between items-end border-b border-gray-200 pb-3">
                <h2 class="text-lg font-black text-brand-navy">配置百分比</h2>
                <div class="text-xl font-black" id="target-total-pct">100%</div>
            </div>

            <div id="target-presets-container">
                <!-- 快速配置按鈕區 -->
            </div>

            <div class="space-y-4" id="target-config-list">
                <!-- 動態生成配置比例調整器 -->
            </div>

            <div class="mt-8">
                <h2 class="text-lg font-black text-brand-navy mb-4">再平衡設定</h2>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <span class="font-bold text-slate-700">絕對偏離目標</span>
                    <div class="flex items-center gap-1">
                        <input type="number" id="input-threshold" class="w-16 bg-slate-50 px-3 py-2 rounded-lg font-bold text-brand-navy text-center border border-gray-200 outline-none focus:border-brand-navy" value="5" onchange="updateSettings()">
                        <span class="text-slate-400 font-bold">%</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 4: 設定 (Settings) ==================== -->
        <section id="view-settings" class="px-5 py-6 space-y-6 hidden">
            <h2 class="text-lg font-black text-brand-navy">系統與 API</h2>
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">Fugle (富果) API Key</label>
                    <input type="password" id="input-api-key" class="w-full bg-slate-50 px-4 py-3 rounded-xl font-mono text-sm border border-gray-200 outline-none focus:border-brand-navy transition-colors" placeholder="請貼上您的 API Key" onchange="updateSettings()">
                </div>
                <p class="text-[11px] text-slate-400">用於即時同步台股報價，金鑰僅儲存於您的瀏覽器本地端，不經任何第三方伺服器。</p>
            </div>

            <h2 class="text-lg font-black text-brand-navy pt-4">資料管理</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="document.getElementById('import-csv-file').click()" class="col-span-2 bg-brand-navy p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
                    <span class="material-symbols-outlined text-white text-2xl">post_add</span>
                    <span class="text-sm font-bold text-white">匯入券商庫存 (CSV)</span>
                </button>
                <button onclick="exportData()" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:bg-gray-50 transition-colors">
                    <span class="material-symbols-outlined text-brand-navy text-2xl">download</span>
                    <span class="text-[11px] font-bold text-slate-700">匯出備份 (JSON)</span>
                </button>
                <button onclick="document.getElementById('import-file').click()" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:bg-gray-50 transition-colors">
                    <span class="material-symbols-outlined text-brand-navy text-2xl">upload</span>
                    <span class="text-[11px] font-bold text-slate-700">還原備份 (JSON)</span>
                </button>
                <input type="file" id="import-csv-file" class="hidden" accept=".csv" onchange="importCsvData(event)">
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
            </div>
            
            <button onclick="factoryReset()" class="w-full mt-4 bg-red-50 text-red-600 font-bold py-4 rounded-2xl border border-red-100 active:bg-red-100 transition-colors">
                清除所有資料 (恢復原廠設定)
            </button>
        </section>

    </main>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-gray-200 flex justify-between px-6 py-2 fixed bottom-0 w-full z-40" style="padding-bottom: max(env(safe-area-inset-bottom), 0.5rem);">
        <button onclick="switchTab('assets')" class="nav-item active flex flex-col items-center gap-1 p-2 text-slate-400 transition-colors" id="tab-btn-assets">
            <span class="material-symbols-outlined text-[24px]">account_balance_wallet</span>
            <span class="text-[10px] font-bold">資產</span>
        </button>
        <button onclick="switchTab('rebalance')" class="nav-item flex flex-col items-center gap-1 p-2 text-slate-400 transition-colors" id="tab-btn-rebalance">
            <span class="material-symbols-outlined text-[24px]">swap_vert</span>
            <span class="text-[10px] font-bold">再平衡</span>
        </button>
        <button onclick="switchTab('targets')" class="nav-item flex flex-col items-center gap-1 p-2 text-slate-400 transition-colors" id="tab-btn-targets">
            <span class="material-symbols-outlined text-[24px]">flag</span>
            <span class="text-[10px] font-bold">目標配置</span>
        </button>
        <button onclick="switchTab('settings')" class="nav-item flex flex-col items-center gap-1 p-2 text-slate-400 transition-colors" id="tab-btn-settings">
            <span class="material-symbols-outlined text-[24px]">settings</span>
            <span class="text-[10px] font-bold">設定</span>
        </button>
    </nav>

    <!-- ==================== Modals ==================== -->
    
    <!-- 股票編輯 Modal -->
    <div id="modal-asset" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl shadow-2xl transform transition-transform translate-y-full flex flex-col max-h-[90vh]" id="modal-asset-content">
            <div class="flex justify-between items-center p-5 border-b border-gray-100">
                <h3 class="font-black text-lg text-brand-navy" id="modal-asset-title">新增/編輯資產</h3>
                <button onclick="closeAssetModal()" class="p-2 bg-gray-100 rounded-full active:scale-95 text-slate-500"><span class="material-symbols-outlined text-[20px]">close</span></button>
            </div>
            <div class="p-5 space-y-4 overflow-y-auto">
                <input type="hidden" id="modal-asset-id">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="text-xs font-bold text-slate-500 block mb-1.5">股票名稱</label>
                        <input type="text" id="modal-asset-name" class="w-full bg-slate-50 px-4 py-3 rounded-xl font-bold border border-gray-200 outline-none focus:border-brand-navy" placeholder="例如：元大台灣50正2">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 block mb-1.5">股票代號</label>
                        <input type="text" id="modal-asset-ticker" class="w-full bg-slate-50 px-4 py-3 rounded-xl font-mono font-bold uppercase border border-gray-200 outline-none focus:border-brand-navy" placeholder="00631L">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 block mb-1.5">即時市價 (NT$)</label>
                        <div class="flex gap-2">
                            <input type="number" id="modal-asset-price" class="w-full bg-slate-50 px-4 py-3 rounded-xl font-mono font-bold border border-gray-200 outline-none focus:border-brand-navy" inputmode="decimal" placeholder="0.00">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 block mb-1.5">持有股數</label>
                        <input type="number" id="modal-asset-shares" class="w-full bg-slate-50 px-4 py-3 rounded-xl font-mono font-bold border border-gray-200 outline-none focus:border-brand-navy" inputmode="numeric" placeholder="0">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 block mb-1.5">平均成本 (選填)</label>
                        <input type="number" id="modal-asset-avgcost" class="w-full bg-slate-50 px-4 py-3 rounded-xl font-mono font-bold border border-gray-200 outline-none focus:border-brand-navy" inputmode="decimal" placeholder="0.00">
                    </div>
                </div>
                
                <div class="flex gap-3 pt-4 border-t border-gray-100 mt-2">
                    <button onclick="deleteAsset()" id="btn-delete-asset" class="hidden flex-1 bg-red-50 text-red-600 font-bold py-3.5 rounded-xl border border-red-100 active:bg-red-100 transition-colors">刪除</button>
                    <button onclick="saveAsset()" class="flex-[2] bg-brand-navy text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition-transform">儲存明細</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 現金編輯 Modal -->
    <div id="modal-cash" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl shadow-2xl transform transition-transform translate-y-full flex flex-col" id="modal-cash-content">
            <div class="flex justify-between items-center p-5 border-b border-gray-100">
                <h3 class="font-black text-lg text-brand-navy">編輯現金</h3>
                <button onclick="closeCashModal()" class="p-2 bg-gray-100 rounded-full active:scale-95 text-slate-500"><span class="material-symbols-outlined text-[20px]">close</span></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1.5">帳戶現金餘額 (NT$)</label>
                    <input type="number" id="modal-cash-value" class="w-full bg-slate-50 px-4 py-3 rounded-xl font-mono font-bold text-xl border border-gray-200 outline-none focus:border-brand-navy" inputmode="numeric">
                </div>
                <button onclick="saveCash()" class="w-full bg-brand-navy text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition-transform mt-4">儲存</button>
            </div>
        </div>
    </div>

    <!-- 提示框 Toast -->
    <div id="toast-container" class="fixed top-12 left-1/2 -translate-x-1/2 z-[100] transition-all transform -translate-y-10 opacity-0 pointer-events-none">
        <div id="toast-message" class="bg-brand-navy text-white px-6 py-3 rounded-full shadow-lg font-bold text-sm flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">info</span>
            <span id="toast-text">提示訊息</span>
        </div>
    </div>

    <script>
        /* ==================== 狀態與核心資料 ==================== */
        const STORAGE_KEY = 'ark_rebalancer_v2_lite';
        
        let state = {
            assets: [
                { id: '1', name: '元大台灣50正2', ticker: '00631L', shares: 1000, price: 61.04, avgCost: 55.0, previousClose: 60.5, targetWeight: 30 },
                { id: '2', name: '群益臺灣加權正2', ticker: '00685L', shares: 400, price: 303.0, avgCost: 310.0, previousClose: 305.0, targetWeight: 30 }
            ],
            cash: 200000,
            cashTargetWeight: 40,
            threshold: 5,
            newFunds: 0,
            fugleKey: '',
            lastUpdate: '--:--'
        };

        let currentTab = 'assets';
        let chartInstance = null;
        
        const STOCK_COLORS = ['#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#10b981', '#06b6d4', '#f43f5e', '#84cc16'];

        /* ==================== 初始化與生命週期 ==================== */
        window.onload = () => {
            loadData();
            switchTab('assets');
            
            // 綁定目標配置的 Input 防呆更新
            document.getElementById('input-new-funds').addEventListener('input', (e) => {
                state.newFunds = parseFloat(e.target.value) || 0;
                saveData();
                renderRebalance();
            });
        };

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    state = { ...state, ...parsed };
                    
                    // 確保舊資料格式相容
                    if(!state.assets) state.assets = [];
                    
                    // 更新 UI 綁定
                    document.getElementById('input-threshold').value = state.threshold;
                    document.getElementById('input-new-funds').value = state.newFunds;
                    document.getElementById('input-api-key').value = state.fugleKey || '';
                } catch (e) { console.error('Data parsing failed'); }
            }
        }

        /* ==================== UI 切換與輔助 ==================== */
        function switchTab(tabId) {
            currentTab = tabId;
            
            // 更新底部按鈕樣式
            ['assets', 'rebalance', 'targets', 'settings'].forEach(id => {
                const btn = document.getElementById(`tab-btn-${id}`);
                const view = document.getElementById(`view-${id}`);
                if (id === tabId) {
                    btn.classList.add('active', 'text-brand-navy');
                    btn.classList.remove('text-slate-400');
                    view.classList.remove('hidden');
                } else {
                    btn.classList.remove('active', 'text-brand-navy');
                    btn.classList.add('text-slate-400');
                    view.classList.add('hidden');
                }
            });

            // 根據不同分頁觸發特定渲染
            const titleMap = { 'assets': '資產總覽', 'rebalance': '再平衡', 'targets': '目標配置', 'settings': '設定' };
            document.getElementById('header-title').innerText = titleMap[tabId];

            if (tabId === 'assets') renderAssets();
            if (tabId === 'rebalance') renderRebalance();
            if (tabId === 'targets') renderTargets();
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const txt = document.getElementById('toast-text');
            txt.innerText = msg;
            
            container.classList.remove('-translate-y-10', 'opacity-0');
            setTimeout(() => {
                container.classList.add('-translate-y-10', 'opacity-0');
            }, 2500);
        }

        /* ==================== 核心計算與渲染 ==================== */
        
        function calculateTotal() {
            let stockTotal = state.assets.reduce((sum, a) => sum + (a.shares * a.price), 0);
            return stockTotal + state.cash;
        }

        // --- TAB 1: 資產 ---
        function renderAssets() {
            const total = calculateTotal();
            document.getElementById('asset-total-value').innerText = Math.round(total).toLocaleString();
            document.getElementById('asset-cash-value').innerText = `NT$${Math.round(state.cash).toLocaleString()}`;
            document.getElementById('asset-cash-pct').innerText = total > 0 ? `${((state.cash / total) * 100).toFixed(1)}%` : '0%';
            document.getElementById('last-update-time').innerText = `最後更新 ${state.lastUpdate}`;

            const listContainer = document.getElementById('asset-list-container');
            let listHtml = '';
            
            let chartLabels = [];
            let chartData = [];
            let chartColors = [];
            let legendHtml = '';

            // 股票
            state.assets.forEach((a, i) => {
                const val = a.shares * a.price;
                const pct = total > 0 ? ((val / total) * 100) : 0;
                const color = STOCK_COLORS[i % STOCK_COLORS.length];
                
                // 盈虧計算 (台灣股市慣例：紅漲/賺，綠跌/賠)
                const totalCost = a.shares * (a.avgCost || a.price); // 沒填均價就當 0 損益
                const plAmount = val - totalCost;
                const plPct = totalCost > 0 ? (plAmount / totalCost) * 100 : 0;
                const plSign = plAmount > 0 ? '▲' : (plAmount < 0 ? '▼' : '');
                const plColorClass = plAmount > 0 ? 'text-red-500' : (plAmount < 0 ? 'text-green-500' : 'text-slate-400');
                
                // 當日漲跌計算
                let dailyHtml = `<span class="text-slate-300 font-mono">--</span>`;
                if (a.previousClose && a.previousClose > 0) {
                    const dailyChange = a.price - a.previousClose;

        function drawChart(labels, data, colors) {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{ data: data, backgroundColor: colors, borderWidth: 0, hoverOffset: 4 }]
                },
                options: {
                    cutout: '70%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: true, callbacks: { label: (c) => ` ${c.raw}%` } }
                    }
                }
            });
        }

        // --- TAB 2: 再平衡 (包含防呆交割計算) ---
        function renderRebalance() {
            const totalCurrent = calculateTotal();
            const totalTargetPool = totalCurrent + state.newFunds;
            
            document.getElementById('rebalance-sim-total').innerText = `NT$ ${Math.round(totalTargetPool).toLocaleString()}`;
            
            const actionsContainer = document.getElementById('rebalance-actions-container');
            const safetyContainer = document.getElementById('rebalance-safety-container');
            const alertBox = document.getElementById('rebalance-alert');
            
            let isImbalanced = false;
            let actionsHtml = '';

            // 檢查與計算
            let calcs = [];
            
            // 記錄操作，用於計算預估餘額
            let totalSellAmount = 0;
            let totalBuyAmount = 0;
            
            // 計算股票
            state.assets.forEach(a => {
                const currentVal = a.shares * a.price;
                const currentPct = totalCurrent > 0 ? (currentVal / totalCurrent) * 100 : 0;
                const targetVal = totalTargetPool * (a.targetWeight / 100);
                
                const diffVal = targetVal - currentVal;
                let actionShares = a.price > 0 ? Math.round(diffVal / a.price) : 0;
                
                const pctDiff = a.targetWeight - currentPct;
                const outOfBounds = Math.abs(pctDiff) > state.threshold;
                if(outOfBounds) isImbalanced = true;

                calcs.push({
                    name: a.ticker || a.name,
                    type: actionShares > 0 ? 'BUY' : (actionShares < 0 ? 'SELL' : 'HOLD'),
                    actionValue: Math.abs(actionShares * a.price),
                    actionShares: Math.abs(actionShares),
                    currentPct: currentPct,
                    targetPct: a.targetWeight,
                    pctDiff: pctDiff,
                    outOfBounds: outOfBounds
                });
            });

            // 【優化 C】：強迫排序，賣出(SELL) 必須在最上方，再來是持平(HOLD)，買入(BUY) 在最後。
            const orderScore = { 'SELL': 1, 'HOLD': 2, 'BUY': 3 };
            calcs.sort((a, b) => {
                if (orderScore[a.type] !== orderScore[b.type]) return orderScore[a.type] - orderScore[b.type];
                return b.actionValue - a.actionValue;
            });

            // 渲染列表並加總交割金額
            calcs.forEach(c => {
                if (c.type === 'SELL') totalSellAmount += c.actionValue;
                if (c.type === 'BUY') totalBuyAmount += c.actionValue;

                const isBuy = c.type === 'BUY';
                const badgeColor = isBuy ? 'bg-brand-green text-white' : (c.type === 'SELL' ? 'bg-brand-navy text-white' : 'bg-gray-200 text-slate-500');
                const badgeText = isBuy ? '★ 買入' : (c.type === 'SELL' ? '★ 賣出' : '持平');
                const diffColor = c.pctDiff > 0 ? 'text-brand-green' : 'text-brand-red';
                const showStar = c.outOfBounds ? '★ ' : '';
                
                actionsHtml += `
                <div class="bg-white p-4 rounded-2xl shadow-sm border ${c.outOfBounds ? 'border-brand-orange/50' : 'border-gray-100'}">
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-brand-navy">${c.name}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${badgeColor}">${c.type==='HOLD'?'符合目標':badgeText}</span>
                        </div>
                        <div class="text-right">
                            <div class="font-black text-sm text-brand-navy ${c.type==='HOLD'?'opacity-30':''}">${c.type==='HOLD'?'無須操作':`NT$${Math.round(c.actionValue).toLocaleString()}`}</div>
                            ${c.type!=='HOLD' ? `<div class="text-[10px] text-slate-500 font-mono font-bold">(${c.actionShares}股)</div>` : ''}
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-500">${c.currentPct.toFixed(1)}% ➔ ${c.targetPct}%</span>
                        <span class="font-mono font-bold ${diffColor}">${showStar}${c.pctDiff > 0 ? '+' : ''}${c.pctDiff.toFixed(1)}%</span>
                    </div>
                </div>`;
            });

            actionsContainer.innerHTML = actionsHtml || '<div class="text-center text-slate-400 text-sm py-4">目前無需調整</div>';
            
            // 【優化 C】：計算預估執行後剩餘交割現金
            let finalEstimatedCash = state.cash + state.newFunds + totalSellAmount - totalBuyAmount;
            let cashWarningHtml = finalEstimatedCash < 0 
                ? `<p class="text-[11px] text-brand-red mt-2 font-bold leading-relaxed">⚠️ 警告：預估執行後現金不足，恐有違約交割風險！請先補足資金或調低股票目標佔比。</p>` 
                : `<p class="text-[11px] text-slate-400 mt-2 font-medium">預估現金充足，可安心依照順序執行操作。</p>`;
                
            safetyContainer.innerHTML = `
                <div class="mt-2 p-4 bg-slate-50 border ${finalEstimatedCash < 0 ? 'border-brand-red/30 bg-red-50/50' : 'border-gray-200'} rounded-2xl">
                    <h4 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-3 flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">shield</span> 交割安全防呆評估
                    </h4>
                    <div class="flex justify-between items-center text-sm border-b border-gray-200 pb-2">
                        <span class="font-bold text-slate-700">預估執行後剩餘現金</span>
                        <span class="font-black font-mono text-base ${finalEstimatedCash < 0 ? 'text-brand-red' : 'text-brand-green'}">
                            NT$ ${Math.round(finalEstimatedCash).toLocaleString()}
                        </span>
                    </div>
                    ${cashWarningHtml}
                </div>
            `;

            document.getElementById('rebalance-alert-threshold').innerText = `${state.threshold}%`;
            if(isImbalanced) { alertBox.classList.remove('hidden'); } else { alertBox.classList.add('hidden'); }
        }
        function triggerRecalculate() { renderRebalance(); }

        // 【優化 A & B】：快速配置演算法 (包含餘數分配防呆)
        function applyTargetPreset(presetType) {
            const stockCount = state.assets.length;
            if (stockCount === 0) return showToast('請先新增股票資產');

            if (presetType === 'zero') {
                state.assets.forEach(a => a.targetWeight = 0);
                state.cashTargetWeight = 100;
            } else if (presetType === 'equal') {
                const totalItems = stockCount + 1; // 包含現金
                const baseWeight = Math.floor(100 / totalItems);
                let remainder = 100 - (baseWeight * totalItems);
                
                state.assets.forEach(a => {
                    a.targetWeight = baseWeight + (remainder > 0 ? 1 : 0);
                    if (remainder > 0) remainder--;
                });
                state.cashTargetWeight = baseWeight + (remainder > 0 ? 1 : 0);
            } else if (presetType === '8020') {
                const baseWeight = Math.floor(80 / stockCount);
                let remainder = 80 - (baseWeight * stockCount);
                
                state.assets.forEach(a => {
                    a.targetWeight = baseWeight + (remainder > 0 ? 1 : 0);
                    if (remainder > 0) remainder--;
                });
                state.cashTargetWeight = 20;
            } else if (presetType === 'allin') {
                const baseWeight = Math.floor(100 / stockCount);
                let remainder = 100 - (baseWeight * stockCount);
                
                state.assets.forEach(a => {
                    a.targetWeight = baseWeight + (remainder > 0 ? 1 : 0);
                    if (remainder > 0) remainder--;
                });
                state.cashTargetWeight = 0;
            }
            
            saveData();
            renderTargets();
            showToast('已套用快速配置', 'success');
        }

        function updateAssetTargetRange(id, val) {
            let newVal = parseInt(val) || 0;
            let otherTotal = 0;
            state.assets.forEach(a => { if (a.id !== id) otherTotal += a.targetWeight; });

            // 防呆：確保股票總和不超過 100%
            if (newVal + otherTotal > 100) {
                newVal = 100 - otherTotal;
                document.getElementById(`target-slider-${id}`).value = newVal; // 強制將滑桿拉回合法最大值
            }

            const asset = state.assets.find(a => a.id === id);
            if (asset) { 
                asset.targetWeight = newVal; 
                state.cashTargetWeight = 100 - (otherTotal + newVal);
                
                // 獨立 DOM 更新：只修改文字與進度條，避免 innerHTML 重繪中斷使用者的拖曳手感
                document.getElementById(`target-pct-${id}`).innerText = `${newVal}%`;
                document.getElementById('target-cash-pct').innerText = `${state.cashTargetWeight}%`;
                document.getElementById('target-cash-slider').value = state.cashTargetWeight;
                
                // 強制將頂部總合校正回 100%
                document.getElementById('target-total-pct').innerText = '100%';
                document.getElementById('target-total-pct').className = 'text-xl font-black text-brand-navy';
                
                saveData(); 
            }
        }

        /* ==================== PWA 支援 (單檔動態注入) ==================== */
        function initPWA() {
            // 1. 動態生成 App Manifest 與 Apple Touch Icon (高質感 SVG 圖示)
            const iconSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230b1120' rx='22'/%3E%3Cpath d='M30 55 L50 35 L70 55 M50 35 L50 75' stroke='%2384cc16' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E";
            const manifest = {
                name: "極簡再平衡", short_name: "再平衡", start_url: location.href,
                display: "standalone", background_color: "#f8fafc", theme_color: "#ffffff",
                icons: [{ src: iconSvg, sizes: "512x512", type: "image/svg+xml" }]
            };
            
            // 改用 Data URI 取代 Blob，徹底避免跨域 iframe 阻擋 blob: 協定的安全報錯
            const manifestUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestUrl}">`);
            document.head.insertAdjacentHTML('beforeend', `<link rel="apple-touch-icon" href="${iconSvg}">`);

            // 已徹底移除 Service Worker (navigator.serviceWorker.register) 以避免控制台報錯。
            // PWA 的「加入主畫面」功能依然可以正常使用。
        }
        initPWA();

        /* ==================== API 報價同步 ==================== */
        async function syncPrices() {
            if (!navigator.onLine) return showToast('目前處於離線狀態，無法同步', 'error');

            if (!state.fugleKey) {
                switchTab('settings');
                return showToast('請先設定 Fugle API Key', 'error');
            }
            
            const icon = document.getElementById('sync-icon');
            icon.classList.add('animate-spin');
            
            let successCount = 0;
            
            for (let a of state.assets) {
                if (!a.ticker) continue;
                try {
                    const res = await fetch(`https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/${a.ticker}`, {
                        headers: { 'X-API-KEY': state.fugleKey }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const price = parseFloat(data.latest_price || data.realtime?.latest_trade_price || data.lastPrice || data.closePrice);
                        
                        // 擷取昨收價用於計算當日漲跌
                        const prevClose = parseFloat(data.previous_close || data.previousClose || data.referencePrice);
                        
                        if (!isNaN(price) && price > 0) {
                            a.price = price;
                            if (!isNaN(prevClose) && prevClose > 0) {
                                a.previousClose = prevClose;
                            }
                            if(data.name) a.name = data.name;
                            successCount++;
                        }
                    }
                } catch(e) { console.error(e); }
            }

            icon.classList.remove('animate-spin');
            
            const now = new Date();
            state.lastUpdate = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            saveData();
            if (currentTab === 'assets') renderAssets();
            if (currentTab === 'rebalance') renderRebalance();
            
            showToast(`已同步 ${successCount} 檔報價`, 'success');
        }

        /* ==================== 資料匯入匯出 ==================== */
        function exportData() {
            saveData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "ark_rebalancer_backup.json");
            dlAnchorElem.click();
        }
        
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    if (parsed.assets && typeof parsed.cash !== 'undefined') {
                        state = parsed;
                        saveData();
                        showToast('資料還原成功！請重新整理。', 'success');
                        setTimeout(() => location.reload(), 1500);
                    } else { showToast('檔案格式錯誤', 'error'); }
                } catch (err) { showToast('讀取失敗', 'error'); }
            };
            reader.readAsText(file);
            e.target.value = ''; // 允許重複選取相同檔案
        }

        /* ==================== 券商 CSV 解析與匯入 ==================== */
        function parseCsvLine(text) {
            let ret = [], inQuote = false, value = '';
            for (let ch of text) {
                if (inQuote) { if (ch === '"') inQuote = false; else value += ch; } 
                else { if (ch === '"') inQuote = true; else if (ch === ',') { ret.push(value); value = ''; } else value += ch; }
            }
            ret.push(value); return ret;
        }

        function importCsvData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                let lines = text.split('\n').filter(l => l.trim().length > 0);
                if (lines.length < 2) return showToast('無效的 CSV 檔案', 'error');

                let headers = parseCsvLine(lines[0]).map(h => h.trim());
                let nameIdx = headers.indexOf('股票名稱');
                let sharesIdx = headers.indexOf('股數');
                let costIdx = headers.indexOf('付出成本');
                let priceIdx = headers.indexOf('市價');

                if (nameIdx === -1 || sharesIdx === -1) {
                    return showToast('找不到必要的欄位 (需包含：股票名稱, 股數)', 'error');
                }

                let isClear = confirm("您想要【清除】現有的股票再匯入嗎？\n\n[確定] = 清空現有股票並以 CSV 取代\n[取消] = 將 CSV 股票附加至現有清單下方");

                let newAssets = [];
                for (let i = 1; i < lines.length; i++) {
                    let cols = parseCsvLine(lines[i]);
                    if (cols.length < headers.length) continue;
                    
                    let name = cols[nameIdx].trim();
                    if (name.includes('總預估') || name.includes('總融資') || name.includes('總成本')) continue;

                    let shares = parseInt((cols[sharesIdx] || '0').replace(/,/g, ''));
                    if (isNaN(shares) || shares <= 0) continue;

                    let cost = parseFloat((cols[costIdx] || '0').replace(/,/g, ''));
                    let price = parseFloat((cols[priceIdx] || '0').replace(/,/g, ''));
                    let avgCost = shares > 0 ? (cost / shares) : 0;

                    newAssets.push({
                        id: Date.now().toString() + i,
                        name: name,
                        ticker: '', // 券商匯出通常無代碼，需手動補上
                        shares: shares,
                        price: price,
                        avgCost: avgCost,
                        previousClose: price, // 預設以現價作為昨收基準
                        targetWeight: 0
                    });
                }

                if (newAssets.length > 0) {
                    if (isClear) state.assets = newAssets;
                    else state.assets.push(...newAssets);
                    
                    saveData();
                    renderAssets();
                    renderTargets();
                    renderRebalance();
                    
                    showToast(`匯入 ${newAssets.length} 檔資產！請點擊卡片補上代號以利同步報價。`, 'success');
                } else {
                    showToast('未能從檔案中解析出任何有效庫存', 'error');
                }
            };
            
            // 台灣券商匯出檔案多為 Big5 編碼，避免中文變亂碼
            reader.readAsText(file, 'Big5');
            e.target.value = ''; // 重置 input 狀態
        }
        
        function factoryReset() {
            if (confirm("警告：這將會清除所有股票與設定資料，確定要恢復原廠設定嗎？")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }
    </script>
</body>
